name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -m 'not integration' --cov=app --cov-report=term-missing
      - run: docker compose up -d --build --wait
      - run: QUEUE_INTEGRATION_URL=http://localhost:8000 pytest -m integration
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
