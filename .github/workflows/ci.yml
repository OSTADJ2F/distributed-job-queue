name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run fast tests with coverage gate
        run: >-
          pytest -m 'not integration'
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  container:
    name: Validate container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag reliable-job-queue:${{ github.sha }} .

  integration-tests:
    name: PostgreSQL and Redis integration
    needs: [quality, unit-tests, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Start the complete stack
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Run live concurrency and recovery tests
        env:
          QUEUE_INTEGRATION_URL: http://localhost:8000
        run: pytest -m integration
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    env:
      API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
      WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger API and worker deployments
        shell: bash
        run: |
          if [[ -z "$API_DEPLOY_HOOK" || -z "$WORKER_DEPLOY_HOOK" ]]; then
            echo "::notice::Render deploy hooks are not configured; deployment skipped."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$API_DEPLOY_HOOK"
          curl --fail --silent --show-error --retry 3 --request POST "$WORKER_DEPLOY_HOOK"
